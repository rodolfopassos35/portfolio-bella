<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartão Digital | STUDIO Bella Martiliano</title>

  <!-- META TAGS PARA PRÉVIA NO WHATSAPP E REDES SOCIALES -->
  <meta property="og:title" content="STUDIO Bella Martiliano | Cartão Digital">
  <meta property="og:description"
    content="Lash Designer & Especialista em Olhar. Agende seu horário ou veja o portfólio completo.">
  <meta property="og:image" content="https://portfolio-bella-two.vercel.app/img/bella.jpeg">
  <meta property="og:url" content="https://portfolio-bella-two.vercel.app/cartao.html">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="cartao-body">

  <main class="cartao-card">
    <!-- Imagem de Perfil -->
    <div class="cartao-avatar">
      <img src="img/bella.jpeg" alt="Bella Martiliano">
    </div>

    <!-- Identificação da Marca -->
    <h1 class="cartao-nome">STUDIO Bella Martiliano</h1>
    <span class="cartao-tag">Lash Designer & Especialista em Olhar</span>

    <!-- Links Interativos -->
    <div class="cartao-links">
      <a href="https://wa.me/55SEUNUMEROAQUI?text=Ol%C3%A1%20Bella!%20Gostaria%20de%20agendar%20um%20hor%C3%A1rio."
        target="_blank" class="btn-cartao btn-whatsapp">
        <i class="fab fa-whatsapp"></i> Agendar pelo WhatsApp
      </a>

      <a href="https://portfolio-bella-two.vercel.app/" class="btn-cartao btn-site">
        <i class="fas fa-globe"></i> Ver Portfólio Completo
      </a>

      <a href="https://instagram.com/SEUINSTAGRAMAQUI" target="_blank" class="btn-cartao btn-insta">
        <i class="fab fa-instagram"></i> Siga no Instagram
      </a>

      <a href="https://maps.google.com/?q=SUA+LOCALIZACAO+AQUI" target="_blank" class="btn-cartao btn-location">
        <i class="fas fa-map-marker-alt"></i> Como Chegar ao Estúdio
      </a>
    </div>

    <!-- ===== QR CODE INSERIDO AQUI ===== -->
    <div class="qr-code-container" style="text-align: center; margin-top: 25px;">
      <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px; font-weight: 500;">Escaneie para compartilhar:</p>

      <img
        src="https://quickchart.io/qr?text=https://portfolio-bella-two.vercel.app/cartao.html&size=180&color=a85d82&margin=1"
        alt="QR Code STUDIO Bella Martiliano"
        style="border-radius: 12px; border: 2px solid #e0c2d1; padding: 8px; background: #fff; width: 180px; height: 180px;">
    </div>
    <!-- ================================== -->

    <footer class="cartao-footer">
      <p>Realçando sua beleza natural com cada fio ✨</p>
    </footer>
  </main>

</body>

</html>
