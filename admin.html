<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel da Bella | Gestão Total</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        font-family: sans-serif;
        background: #f9f4f7;
        padding: 20px;
        color: #333;
        max-width: 600px;
        margin: 0 auto;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 15px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      h1,
      h2 {
        color: #a85d82;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
      }
      h2 {
        font-size: 1.2rem;
        margin-top: 30px;
        border-bottom: 2px solid #a85d82;
        padding-bottom: 5px;
      }
      label {
        font-weight: bold;
        font-size: 0.9rem;
        display: block;
        margin-top: 10px;
      }
      input,
      select {
        width: 100%;
        padding: 10px;
        margin-top: 4px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 1rem;
      }
      /* Estilo da caixa de seleção do novo serviço */
      .checkbox-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 15px;
        background: #f0e4eb;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .checkbox-container input {
        width: auto;
        margin: 0;
        cursor: pointer;
      }
      .checkbox-container span {
        font-weight: bold;
        font-size: 0.9rem;
        color: #a85d82;
      }
      #campos-novo-servico {
        display: none;
        background: #fff5f9;
        padding: 12px;
        border-radius: 8px;
        border: 1px dashed #a85d82;
        margin-top: 10px;
      }
      button {
        width: 100%;
        background: #a85d82;
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        margin-top: 15px;
        cursor: pointer;
        transition: background 0.3s ease;
      }
      button:disabled {
        background: #ccc !important;
        cursor: not-allowed;
      }
      button.btn-danger {
        background: #d9534f;
      }
      button.btn-sair {
        background: transparent;
        color: #888;
        border: 1px solid #ccc;
        padding: 6px 12px;
        font-size: 0.8rem;
        width: auto;
        margin: 0 auto 15px auto;
        display: block;
        border-radius: 20px;
      }
      .grid-fotos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
      }
      .foto-card img {
        width: 100%;
        height: 100px;
        object-fit: cover;
        border-radius: 8px;
      }
      #tela-login {
        text-align: center;
        margin-top: 50px;
      }
      #conteudo-painel {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- ECRÃ DE LOGIN -->
    <div id="tela-login" class="card">
      <h1>🌸 Acesso Restrito</h1>
      <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px">
        Inicie sessão para gerir o Studio Bella Martiliano:
      </p>

      <label style="text-align: left">Email:</label>
      <input
        type="email"
        id="login-email"
        placeholder="exemplo@email.com"
        autocomplete="email"
      />

      <label style="text-align: left">Palavra-passe:</label>
      <input
        type="password"
        id="login-senha"
        placeholder="Digite a palavra-passe..."
        autocomplete="current-password"
      />

      <button id="btn-entrar" onclick="fazerLogin()">Entrar no Painel</button>
    </div>

    <!-- CONTEÚDO DO PAINEL -->
    <div id="conteudo-painel">
      <button class="btn-sair" onclick="fazerLogout()">
        🔒 Sair / Terminar Sessão
      </button>

      <h1>🌸 Painel da Bella</h1>

      <!-- SEÇÃO DE PREÇOS EXISTENTES -->
      <h2>🏷️ Tabela de Preços Atual</h2>
      <div id="lista-servicos">A carregar serviços...</div>

      <!-- SEÇÃO DE GALERIA DE FOTOS E CADASTRO -->
      <h2>📸 Publicar Foto / Novo Serviço</h2>
      <div class="card">
        <h3>Adicionar Foto</h3>

        <label>Título / Nome do Procedimento:</label>
        <input
          type="text"
          id="foto-titulo"
          list="sugestoes-titulos"
          placeholder="Ex: Volume Wispy"
          autocomplete="off"
        />
        <datalist id="sugestoes-titulos">
          <option value="Volume Brasileiro"></option>
          <option value="Volume Egípcio"></option>
          <option value="Volume Baby"></option>
          <option value="Efeito Fox Eye"></option>
          <option value="Volume Wispy"></option>
          <option value="Design com Henna"></option>
          <option value="Design sem Henna"></option>
        </datalist>

        <label>Categoria (Filtro do site):</label>
        <input
          type="text"
          id="foto-categoria"
          list="sugestoes-categorias"
          placeholder="Ex: volume-wispy"
          autocomplete="off"
        />
        <datalist id="sugestoes-categorias">
          <option value="volume-brasileiro"></option>
          <option value="volume-egipcio"></option>
          <option value="efeito-fox"></option>
          <option value="volume-baby"></option>
          <option value="volume-wispy"></option>
          <option value="sobrancelha"></option>
        </datalist>

        <label>Selecione a Imagem:</label>
        <input type="file" id="foto-arquivo" accept="image/*" />

        <!-- CHECKBOX PARA NOVO SERVIÇO -->
        <div class="checkbox-container" onclick="toggleCamposServico()">
          <input
            type="checkbox"
            id="chk-novo-servico"
            onclick="
              event.stopPropagation();
              toggleCamposServico();
            "
          />
          <span>✨ É um novo serviço? (Adicionar à Tabela de Preços)</span>
        </div>

        <!-- CAMPOS EXTRAS QUE SÓ APARECEM SE O CHECKBOX FOR MARCADO -->
        <div id="campos-novo-servico">
          <label>Secção da Tabela:</label>
          <select id="srv-categoria-tipo">
            <option value="Lash / Cílios">Extensão de Cílios</option>
            <option value="Sobrancelhas">Design de Sobrancelhas</option>
          </select>

          <label>Preço Principal (R$):</label>
          <input
            type="number"
            step="0.01"
            id="srv-preco"
            placeholder="Ex: 110.00"
          />

          <label>Manutenção 15 dias (Opcional):</label>
          <input type="text" id="srv-m15" placeholder="Ex: R$ 95,00" />

          <label>Manutenção 22 dias (Opcional):</label>
          <input type="text" id="srv-m22" placeholder="Ex: R$ 100,00" />
        </div>

        <button id="btn-upload" onclick="adicionarFotoEServico()">
          📤 Fazer Upload e Publicar
        </button>
      </div>

      <h3>Fotos Atuais na Galeria</h3>
      <div id="lista-fotos" class="grid-fotos">A carregar galeria...</div>
    </div>

    <script>
      const SUPABASE_URL = "https://zxrdgftskzgzkmzspmrb.supabase.co/";
      const SUPABASE_KEY = "sb_publishable_mnSYr7BG5eLx4x6wK_qejg_gKBkytbo";

      const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        global: { headers: { apikey: SUPABASE_KEY } },
      });

      function toggleCamposServico() {
        const chk = document.getElementById("chk-novo-servico");
        const campos = document.getElementById("campos-novo-servico");
        campos.style.display = chk.checked ? "block" : "none";
      }

      // --- AUTENTICAÇÃO ---
      async function verificarSessao() {
        const {
          data: { session },
        } = await _supabase.auth.getSession();
        if (session) {
          exibirPainel();
        } else {
          exibirLogin();
        }
      }

      async function fazerLogin() {
        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-senha").value;
        const btn = document.getElementById("btn-entrar");

        if (!email || !password) {
          alert("Por favor, preencha o email e a palavra-passe!");
          return;
        }

        btn.disabled = true;
        btn.innerText = "⏳ A autenticar...";

        const { data, error } = await _supabase.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          alert("Erro ao iniciar sessão: " + error.message);
          btn.disabled = false;
          btn.innerText = "Entrar no Painel";
        } else {
          exibirPainel();
        }
      }

      async function fazerLogout() {
        await _supabase.auth.signOut();
        exibirLogin();
      }

      function exibirPainel() {
        document.getElementById("tela-login").style.display = "none";
        document.getElementById("conteudo-painel").style.display = "block";
        carregarServicos();
        carregarFotos();
      }

      function exibirLogin() {
        document.getElementById("tela-login").style.display = "block";
        document.getElementById("conteudo-painel").style.display = "none";
        document.getElementById("btn-entrar").disabled = false;
        document.getElementById("btn-entrar").innerText = "Entrar no Painel";
      }

      document
        .getElementById("login-senha")
        ?.addEventListener("keypress", function (e) {
          if (e.key === "Enter") fazerLogin();
        });

      verificarSessao();

      // --- SERVIÇOS ---
      async function carregarServicos() {
        const container = document.getElementById("lista-servicos");
        const { data, error } = await _supabase
          .from("servicos")
          .select("*")
          .order("id", { ascending: true });

        if (error || !data || data.length === 0) {
          container.innerHTML =
            "<p>Nenhum serviço cadastrado na tabela de preços.</p>";
          return;
        }

        container.innerHTML = "";
        data.forEach((item) => {
          container.innerHTML += `
            <div class="card">
              <h3>${item.nome}</h3>
              <p><small>Categoria: ${item.categoria || "Geral"}</small></p>
              
              <label>Preço Principal (R$):</label>
              <input type="number" step="0.01" id="preco-${item.id}" value="${item.preco}">

              <label>Manutenção 15 dias:</label>
              <input type="text" id="m15-${item.id}" value="${item.manutencao_15 || ""}">

              <label>Manutenção 22 dias:</label>
              <input type="text" id="m22-${item.id}" value="${item.manutencao_22 || ""}">

              <button onclick="salvarServico(${item.id}, this)">💾 Guardar Alteração</button>
              <button class="btn-danger" onclick="excluirServico(${item.id}, this)" style="margin-top: 5px;">🗑️ Apagar Serviço</button>
            </div>
          `;
        });
      }

      async function salvarServico(id, btn) {
        const novoPreco = document.getElementById(`preco-${id}`).value;
        const novaM15 = document.getElementById(`m15-${id}`).value;
        const novaM22 = document.getElementById(`m22-${id}`).value;

        btn.disabled = true;
        btn.innerText = "⏳ A guardar...";

        const { error } = await _supabase
          .from("servicos")
          .update({
            preco: novoPreco,
            manutencao_15: novaM15,
            manutencao_22: novaM22,
          })
          .eq("id", id);

        if (error) {
          alert("Erro ao guardar: " + error.message);
        } else {
          alert("✨ Preço atualizado com sucesso!");
        }

        btn.disabled = false;
        btn.innerText = "💾 Guardar Alteração";
      }

      async function excluirServico(id, btn) {
        if (
          !confirm(
            "Tem certeza que deseja apagar este serviço da tabela de preços?",
          )
        )
          return;

        btn.disabled = true;
        btn.innerText = "⏳ A apagar...";

        const { error } = await _supabase
          .from("servicos")
          .delete()
          .eq("id", id);

        if (error) {
          alert("Erro ao apagar serviço: " + error.message);
          btn.disabled = false;
          btn.innerText = "🗑️ Apagar Serviço";
        } else {
          carregarServicos();
        }
      }

      // --- GALERIA DE FOTOS E UPLOAD (COM SUPORTE A NOVO SERVIÇO) ---
      async function carregarFotos() {
        const container = document.getElementById("lista-fotos");
        const { data, error } = await _supabase
          .from("fotos")
          .select("*")
          .order("id", { ascending: false });

        if (error || !data || data.length === 0) {
          container.innerHTML = "<p>Nenhuma foto na galeria.</p>";
          return;
        }

        container.innerHTML = "";
        data.forEach((foto) => {
          container.innerHTML += `
            <div class="card foto-card">
              <img src="${foto.url}" alt="${foto.titulo}">
              <p style="font-size: 0.8rem; margin: 5px 0;"><strong>${foto.titulo}</strong></p>
              <p style="font-size: 0.7rem; color: #888;">${foto.categoria}</p>
              <button class="btn-danger" onclick="excluirFoto(${foto.id}, '${foto.url}', this)">🗑️ Remover</button>
            </div>
          `;
        });
      }

      function otimizarImagem(file) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
              const canvas = document.createElement("canvas");
              let largura = img.width;
              let altura = img.height;
              const larguraMaxima = 1080;

              if (largura > larguraMaxima) {
                altura = Math.round((altura * larguraMaxima) / largura);
                largura = larguraMaxima;
              }

              canvas.width = largura;
              canvas.height = altura;

              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, largura, altura);

              canvas.toBlob(
                (blob) => {
                  resolve(blob);
                },
                "image/webp",
                0.82,
              );
            };
          };
        });
      }

      async function adicionarFotoEServico() {
        const btn = document.getElementById("btn-upload");
        const inputTitulo = document.getElementById("foto-titulo");
        const inputCategoria = document.getElementById("foto-categoria");
        const arquivoInput = document.getElementById("foto-arquivo");
        const chkNovoServico = document.getElementById("chk-novo-servico");

        const titulo = inputTitulo.value.trim();
        const categoria = inputCategoria.value
          .trim()
          .toLowerCase()
          .replace(/\s+/g, "-");
        const arquivo = arquivoInput.files[0];

        if (!titulo || !arquivo) {
          alert("Por favor, preencha o título e selecione uma imagem!");
          return;
        }

        let precoVal = 0;
        if (chkNovoServico.checked) {
          precoVal = parseFloat(document.getElementById("srv-preco").value);
          if (isNaN(precoVal)) {
            alert("Por favor, informe o Preço Principal do novo serviço!");
            return;
          }
        }

        btn.disabled = true;
        btn.innerText = "⏳ A otimizar e enviar...";

        try {
          // 1. Otimiza e envia a foto para o Storage
          const imagemOtimizadaBlob = await otimizarImagem(arquivo);
          const nomeArquivo = `${Date.now()}_foto.webp`;

          const { error: storageError } = await _supabase.storage
            .from("galeria")
            .upload(nomeArquivo, imagemOtimizadaBlob, {
              contentType: "image/webp",
            });

          if (storageError) throw storageError;

          const { data: publicUrlData } = _supabase.storage
            .from("galeria")
            .getPublicUrl(nomeArquivo);

          const urlPublica = publicUrlData.publicUrl;

          // 2. Insere a foto na tabela 'fotos'
          const { error: dbFotoError } = await _supabase.from("fotos").insert([
            {
              titulo: titulo,
              categoria: categoria || "geral",
              url: urlPublica,
            },
          ]);

          if (dbFotoError) throw dbFotoError;

          // 3. Se marcou o checkbox, insere também na tabela 'servicos'
          if (chkNovoServico.checked) {
            const catTipo = document.getElementById("srv-categoria-tipo").value;
            const m15Val = document.getElementById("srv-m15").value.trim();
            const m22Val = document.getElementById("srv-m22").value.trim();

            const { error: dbServicoError } = await _supabase
              .from("servicos")
              .insert([
                {
                  nome: titulo,
                  categoria: catTipo,
                  preco: precoVal,
                  manutencao_15: m15Val,
                  manutencao_22: m22Val,
                  ordem: 99,
                },
              ]);

            if (dbServicoError) throw dbServicoError;
          }

          alert("✨ Publicado com sucesso!");

          // Limpa todos os campos
          inputTitulo.value = "";
          inputCategoria.value = "";
          arquivoInput.value = "";
          document.getElementById("srv-preco").value = "";
          document.getElementById("srv-m15").value = "";
          document.getElementById("srv-m22").value = "";
          chkNovoServico.checked = false;
          toggleCamposServico();

          carregarFotos();
          carregarServicos();
        } catch (erro) {
          alert("Erro no processo: " + erro.message);
        } finally {
          btn.disabled = false;
          btn.innerText = "📤 Fazer Upload e Publicar";
        }
      }

      async function excluirFoto(id, url, btn) {
        if (!confirm("Tem certeza que deseja remover esta foto?")) return;

        btn.disabled = true;
        btn.innerText = "⏳ A remover...";

        const nomeArquivo = url.split("/").pop();

        await _supabase.storage.from("galeria").remove([nomeArquivo]);
        const { error } = await _supabase.from("fotos").delete().eq("id", id);

        if (error) {
          alert("Erro ao excluir foto: " + error.message);
          btn.disabled = false;
          btn.innerText = "🗑️ Remover";
        } else {
          carregarFotos();
        }
      }
    </script>
  </body>
</html>
